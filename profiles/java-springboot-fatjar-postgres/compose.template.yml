# Plantilla de orquestación — perfil java-springboot-fatjar-postgres (VARIAS PIEZAS).
# Rehydrate sustituye las variables {{...}} con lo que el artefacto trae hardcodeado
# (el artefacto dicta el ambiente, D17) y con NOTAS.md (servidor y versiones, D18).
#
# Reglas que esta plantilla hace cumplir por construcción:
#   - Red INTERNA (D19): sin salida a internet ni a la VPN de la máquina. El puerto del
#     app se publica por el proxy `ingress` (ahí irá el proxy HTTP de PEPPER).
#   - Todo host externo del artefacto se resuelve por alias DNS al `stub`, que responde
#     503 y registra cada petición (evidencia de dependencias).
#   - Cada servicio fija `dns:` a un sumidero dentro de la subred interna (D22, DNS): el
#     resolver embebido de Docker reenvía lo que no es alias al resolver del host — con
#     VPN, al institucional — y esa consulta lleva el nombre de un host de producción.
#   - Un servicio POR PIEZA: ese bloque lo fabrica Rehydrate repitiendo
#     service.template.yml con las variables de cada componente (D32). El ingress entra
#     por la pieza que `rehydrate.components.ingress_role` declare.
#   - `pepper isolate <compose> --hosts <hosts>` debe salir en verde ANTES de levantar,
#     y con --live después: el aislamiento lo verifica el núcleo, no el agente.
#   - Observabilidad de antemano: log_statement=all en la base, DEBUG en la app.
#   - Al terminar la sesión de trabajo: `docker compose down -v --remove-orphans` —
#     el volumen db-data conserva el respaldo restaurado hasta que se borra explícito.

name: {{stack_name}}-rehydrate

networks:
  legacy:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: {{subnet}}            # el /24 de las IPs que el artefacto espera
          gateway: {{gateway_ip}}       # la fija PEPPER: si el datasource cae en la .1, Docker chocaría con la puerta
  edge:
    driver: bridge                     # SOLO el ingress: Docker no publica puertos desde una red internal (D22)
volumes:
  db-data:
  app-files:

services:
  db:
    image: {{db_image}}                    # la versión de la cabecera del respaldo, vía rehydrate.database.images
    platform: ${PEPPER_PLATFORM}      # la dicta el registro: amd64 emulado si la imagen exigida no existe para esta máquina
    dns: [{{dns_sink}}]                   # IP libre de la subred interna: lo que no sea alias muere aquí, no va al resolver del host
    environment:
      POSTGRES_DB: {{db_name}}             # el nombre que el artefacto espera (no el del respaldo)
      POSTGRES_USER: {{db_user}}
      POSTGRES_PASSWORD: ${DB_PASSWORD}    # en .env (pepper-out/, no se versiona)
    command: ["postgres", "-c", "log_statement=all", "-c", "log_line_prefix=%m [%p] %u@%d ", "-c", "log_destination=stderr"]
    networks:
      legacy:
        ipv4_address: {{db_ip}}            # la IP del datasource del artefacto
        aliases: {{db_alias}}              # y su nombre, si el datasource iba por nombre
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{db_user}} -d {{db_name}}"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Restaura el respaldo con un cliente de la versión del pg_dump que lo generó, y
  # re-apunta todo pg_foreign_server al stub (un respaldo puede traer credenciales
  # de producción en sus USER MAPPING). Una vez: docker compose --profile restore run --rm restore
  restore:
    image: {{db_tool_image}}               # un cliente >= la versión del pg_dump que generó el respaldo
    platform: ${PEPPER_PLATFORM}      # la dicta el registro: amd64 emulado si la imagen exigida no existe para esta máquina
    dns: [{{dns_sink}}]                   # IP libre de la subred interna: lo que no sea alias muere aquí, no va al resolver del host
    profiles: ["restore"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      PGHOST: {{db_ip}}
      PGUSER: {{db_user}}
      PGDATABASE: {{db_name}}
    networks: [legacy]
    volumes:
      - {{dump_path}}:/dump/backup.dump:ro
      - ./restore.sh:/restore.sh:ro
    entrypoint: ["/bin/sh", "/restore.sh"]

  # ./stub/stub.py es copia de pepper/stub.py (autocontenido; Rehydrate lo copia,
  # igual que el proxy). Los puertos son los que el artefacto espera de sus externos.
  stub:
    image: python:3-alpine
    dns: [{{dns_sink}}]                   # IP libre de la subred interna: lo que no sea alias muere aquí, no va al resolver del host
    command: ["python3", "-u", "/stub/stub.py", "--ports", "{{stub_ports}}"]
    networks:
      legacy:
        ipv4_address: {{stub_ip}}          # la IP de los servicios externos que el artefacto espera
        aliases: {{external_hosts}}        # cada host externo del artefacto: buses, SMTP, APIs
    volumes:
      - ./stub:/stub:ro

{{components}}
  ingress:
    image: python:3-alpine
    dns: [{{dns_sink}}]                   # IP libre de la subred interna: lo que no sea alias muere aquí, no va al resolver del host
    command: ["python3", "-u", "/pepper-proxy.py", "--listen", "0.0.0.0:8080", "--upstream", "{{entry_ip}}:{{entry_port}}"]
    depends_on:
      {{entry_component}}:                 # la pieza por la que entra la gente (rehydrate.components.ingress_role)
        condition: service_started
    networks: [legacy, edge]                   # legacy: alcanza al app · edge: publica el puerto al host (nadie más la usa)
    ports:
      - "127.0.0.1:{{host_port}}:8080"   # SOLO localhost: en 0.0.0.0 cualquier equipo de tu LAN alcanza el legacy (H-04)
    volumes:
      - ./proxy/proxy.py:/pepper-proxy.py:ro   # la única excepción de montaje en el ingress
