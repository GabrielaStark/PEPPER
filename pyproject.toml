[project]
name = "pepper-discovery"
version = "0.1.0"
description = "Descubrimiento dinámico de sistemas legacy: reconstruye, observa, correlaciona y exporta evidencia de ejecución."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "jsonschema>=4",
]

[project.optional-dependencies]
explore = ["playwright>=1.50"]

# Sin entrypoint instalable: el núcleo lee `schemas/`, `profiles/` y `examples/` del clon,
# así que se usa desde ahí con `python3 -m pepper` (README). Un `pip install .` dejaría un
# ejecutable que no encuentra sus perfiles.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pepper*"]
