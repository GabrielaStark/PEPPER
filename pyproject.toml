# PEPPER no es un paquete instalable: se usa desde el clon con `python3 -m pepper …`.
# El núcleo lee `schemas/`, `profiles/`, `examples/` y `.claude/skills/` de la raíz del
# repositorio; un wheel solo llevaría `pepper/` y dejaría un ejecutable que no encuentra
# sus perfiles (D28, docs/documentacion/DECISIONES.md). Antes este archivo declaraba un
# proyecto `pepper-discovery` con setuptools y `pip install .` producía justo ese
# artefacto a medias sin quejarse (revisión 2026-09-21). Ahora cualquier intento de
# construirlo falla con el porqué: scripts/pepper_no_install.py.
#
# Dependencias de desarrollo y validación: `pip install -r requirements-dev.txt`.
# Python 3.9+.

[build-system]
requires = []
build-backend = "pepper_no_install"
backend-path = ["scripts"]
